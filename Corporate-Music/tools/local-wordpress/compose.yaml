name: corporate-music

services:
  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_520_ci]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: corporate-music_local
      MYSQL_USER: radman
      MYSQL_PASSWORD: ${MUSIC_DB_PASSWORD:?Run WordPress-Start.cmd first}
      MYSQL_ROOT_PASSWORD: ${MUSIC_DB_ROOT_PASSWORD:?Run WordPress-Start.cmd first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse "SELECT 1" >/dev/null 2>&1']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  wordpress:
    image: wordpress:php8.4-apache@sha256:309307430abf80009378a63a79df73554a6449b700fac59a991b4959e6dda8ca
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8098:80'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: corporate-music_local
      WORDPRESS_DB_USER: radman
      WORDPRESS_DB_PASSWORD: ${MUSIC_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: rdct_
      WORDPRESS_DEBUG: '1'
      MUSIC_LOCAL_SITE: '1'
      MUSIC_LOCAL_URL: http://127.0.0.1:8098
      MUSIC_ADMIN_USER: ${MUSIC_ADMIN_USER:?Run Start.cmd first}
      MUSIC_ADMIN_PASSWORD: ${MUSIC_ADMIN_PASSWORD:?Run WordPress-Start.cmd first}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('MUSIC_LOCAL_URL'));
        define('WP_SITEURL', getenv('MUSIC_LOCAL_URL'));
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', '/tmp/corporate-music-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
    volumes:
      - wordpress:/var/www/html
      - ../../radmanct:/var/www/html/wp-content/themes/radmanct:ro
      - ./provision.php:/opt/corporate-music/provision.php:ro
      - ./local-boundaries.php:/var/www/html/wp-content/mu-plugins/corporate-music-local.php:ro
      - ../../fixtures:/opt/corporate-music/fixtures:ro
      - ./php.ini:/usr/local/etc/php/conf.d/corporate-music.ini:ro
    healthcheck:
      test: [CMD, php, '-r', "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  database:
    name: corporate-music-mysql84-database
  wordpress:
    name: corporate-music-wordpress
