name: darooyi
x-wordpress: &wordpress-runtime
  image: wordpress:php8.3-apache@sha256:f32ffa85064d9c951b7b69c929fa2a9f682aa4443e0c0a56ac2000499cb64383
  environment:
    DAROOYI_DB_PASSWORD: ${DAROOYI_DB_PASSWORD:?Create the local .env first}
    DAROOYI_LOCAL_URL: http://127.0.0.1:8099
  networks: [isolated]
services:
  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: darooyic_wpdb
      MYSQL_USER: darooyi
      MYSQL_PASSWORD: ${DAROOYI_DB_PASSWORD:?Create the local .env first}
      MYSQL_ROOT_PASSWORD: ${DAROOYI_ROOT_PASSWORD:?Create the local .env first}
    command: ["--max-allowed-packet=256M"]
    volumes:
      - db:/var/lib/mysql
      - ./darooyic_wpdb.sql:/docker-entrypoint-initdb.d/01-customer.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT COUNT(*) FROM cmp_options' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 35
      start_period: 15s
    networks: [isolated]
  prepare:
    <<: *wordpress-runtime
    entrypoint: ["/bin/bash", "/setup/prepare.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - site:/var/www/html
      - ./public_html:/snapshot:ro
      - ./docker:/setup:ro
      - ./.local:/local-input:ro
  wordpress:
    <<: *wordpress-runtime
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - site:/var/www/html
      - ./docker/ioncube.ini:/usr/local/etc/php/conf.d/00-darooyi-ioncube.ini:ro
      - ./.local/ioncube_loader_lin_8.3.so:/opt/ioncube/ioncube_loader_lin_8.3.so:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-darooyi.ini:ro
      - ./docker/local-apache.conf:/etc/apache2/conf-enabled/zz-darooyi.conf:ro
  gateway:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    depends_on:
      wordpress:
        condition: service_started
        restart: true
    ports: ["127.0.0.1:8099:80"]
    volumes:
      - ./docker/local-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [isolated, loopback-ingress]
networks:
  loopback-ingress: {}
  isolated:
    internal: true
volumes:
  db:
  site:
