<IfModule !mod_headers.c>
  LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
Header always set X-Robots-Tag "noindex, nofollow"
Header always set Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; form-action 'self'"
