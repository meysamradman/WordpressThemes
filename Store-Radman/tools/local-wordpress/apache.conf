ServerName localhost
Listen 8143

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://127.0.0.1:8143/
</VirtualHost>

<VirtualHost *:8143>
    ServerName localhost
    DocumentRoot /var/www/html
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/store-radman/tls/cert.pem
    SSLCertificateKeyFile /etc/store-radman/tls/key.pem
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
